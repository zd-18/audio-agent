spring:
  application:
    name: audio-agent-backend
  profiles:
    active: dev
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 8080

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-log: false

# MyBatis DEBUG statements include bound parameter values. Keep transcript SQL
# logging disabled in every profile so full text and segment text stay private.
logging:
  level:
    com.audioagent.transcription.mapper: warn
    com.audioagent.transcript.mapper: warn
    com.audioagent.contentanalysis.mapper: warn
    com.audioagent.agent.mapper: warn

audio:
  outbox:
    enabled: true
    batch-size: 50
    max-retry-count: 5
    scan-interval-ms: 1000
    initial-retry-delay-ms: 2000
    max-retry-delay-ms: 300000
    confirm-timeout-ms: 10000
    lock-timeout-ms: 60000
    exchange: audio-agent.events
    routing-key: outbox.event
    queue: audio-agent.outbox.events
    consumer-retry-queue: audio-agent.outbox.events.retry
    consumer-retry-routing-key: outbox.event.retry
    consumer-dlq: audio-agent.outbox.events.dlq
    consumer-dlq-routing-key: outbox.event.dlq
    consumer-max-retry-count: 3
    consumer-retry-delay-ms: 5000
